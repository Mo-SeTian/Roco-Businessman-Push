<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 洛克王国远行商人推送</title>
<style>
  body{margin:0;font-family:system-ui,"Segoe UI","Microsoft YaHei",sans-serif;background:#f2f0ea;
       display:flex;align-items:center;justify-content:center;height:100vh}
  .card{background:#fff;border-radius:14px;padding:36px 40px;width:320px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
  h1{font-size:18px;margin:0 0 6px;text-align:center}
  p.sub{font-size:12px;color:#888;margin:0 0 22px;text-align:center}
  label{display:block;font-size:13px;color:#555;margin:12px 0 4px}
  input{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid #ddd;border-radius:8px;font-size:14px}
  button{width:100%;margin-top:22px;padding:10px;border:0;border-radius:8px;background:#fa8c16;
         color:#fff;font-size:15px;cursor:pointer}
  button:hover{background:#e07f10}
  .err{color:#d4380d;font-size:13px;margin-top:12px;text-align:center;min-height:18px}
</style>
</head>
<body>
<div class="card">
  <h1>洛克王国远行商人推送</h1>
  <p class="sub">请登录控制台</p>
  <label>用户名</label><input id="u" autocomplete="username">
  <label>密码</label><input id="p" type="password" autocomplete="current-password">
  <button onclick="doLogin()">登 录</button>
  <div class="err" id="err"></div>
</div>
<script>
async function doLogin(){
  const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:u.value,password:p.value})});
  if(r.ok){location.href='/';}else{err.textContent=(await r.json()).detail||'登录失败';}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
</body>
</html>
